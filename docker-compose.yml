services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shortlink}
      POSTGRES_USER: ${POSTGRES_USER:-shortlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortlink}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-shortlink}:${POSTGRES_PASSWORD:-shortlink}@postgres:5432/${POSTGRES_DB:-shortlink}?schema=public
      REDIS_URL: redis://redis:6379
      IP_HASH_SECRET: ${IP_HASH_SECRET:-dev-only-change-me}
      NODE_ENV: ${NODE_ENV:-development}
      TRUSTED_PROXY: 172.30.0.0/24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
